<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>补充学校资料</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f1;color:#19362c;font:16px system-ui,sans-serif;padding:24px}
main{width:100%;max-width:430px;background:white;padding:40px;border-radius:22px;box-shadow:0 16px 70px #19362c12}.brand{font-size:12px;letter-spacing:3px;color:#52836b}h1{font-size:30px;margin:18px 0 8px}p{color:#6a7770;line-height:1.7;font-size:14px}label{display:block;margin:20px 0 7px;font-size:14px}input,select{width:100%;padding:13px;border:1px solid #d4ddd5;border-radius:9px;font:inherit}input:focus{outline:2px solid #65987c}button{cursor:pointer;width:100%;padding:14px;border:0;border-radius:9px;background:#245940;color:white;font:inherit;margin-top:24px}button:disabled{opacity:.6}.secondary{background:transparent;color:#245940;margin-top:8px;padding:10px}#error{color:#b33434;min-height:22px}footer{font-size:12px;color:#829087;margin-top:25px}[hidden]{display:none!important}
</style></head><body><main><div class="brand">IELTS ATLAS</div><h1>补充学校资料</h1><p>请选择学校；示例学校学生请同时选择年级和班级。保存后即可继续，已有练习数据不受影响。</p><form id="form"><div id="school-wrap"><label for="school">学校</label><select id="school"><option value="">请选择学校</option><option value="sample_school">示例学校</option></select><div id="custom-school" hidden><label for="schoolName">学校名称</label><input id="schoolName" maxlength="100" autocomplete="organization"></div><div id="school-class" hidden style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div><label for="grade">年级</label><select id="grade"><option value="">选择年级</option><option>Pre</option><option>G10</option><option>G11</option><option>G12</option><option>English Dept.</option></select></div><div><label for="className">班级</label><select id="className"><option value="">选择班级</option><option value="1">1 班</option><option value="2">2 班</option><option value="3">3 班</option><option value="4">4 班</option><option value="5">5 班</option><option value="6">6 班</option><option value="7">7 班</option><option value="8">8 班</option><option value="9">9 班</option></select></div></div></div><p id="error" role="alert"></p><button id="submit" disabled>正在加载…</button></form><button id="logout" class="secondary" type="button">切换账号</button></main><script>
const el=id=>document.getElementById(id);let uid='';
function schoolFields(){const enabled=!el('school-wrap').hidden,sample_school=el('school').value==='sample_school',other=el('school').value==='other';el('school').required=enabled;el('custom-school').hidden=!enabled||!other;el('school-class').hidden=!enabled||!sample_school;el('schoolName').required=enabled&&other;el('grade').required=enabled&&sample_school;const needsClass=enabled&&sample_school&&el('grade').value!=='Pre'&&el('grade').value!=='English Dept.';el('className').required=needsClass;el('className').parentElement.hidden=!needsClass;if(!needsClass)el('className').value='';}
el('school').onchange=schoolFields;el('grade').onchange=schoolFields;
function profileBody(){return {school:el('school').value,schoolName:el('schoolName').value,grade:el('grade').value,className:el('className').value};}

schoolFields();
fetch('/api/status',{cache:'no-store'}).then(r=>r.json()).then(s=>{if(!s.access||!s.user){location.replace('/login');return;}uid=s.user.id;el('submit').disabled=false;el('submit').textContent='保存并继续';}).catch(()=>{el('error').textContent='加载失败，请刷新重试。';});
el('form').onsubmit=async e=>{e.preventDefault();el('submit').disabled=true;el('submit').textContent='正在保存…';el('error').textContent='';try{const r=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json','X-IELTS-User':uid},body:JSON.stringify(profileBody()),signal:AbortSignal.timeout(20000)});const d=await r.json();if(!r.ok)throw Error(d.error||'保存失败');location.replace('/');}catch(e){el('error').textContent=e.name==='TimeoutError'?'保存超时，请重试。':e.message;}finally{el('submit').disabled=false;el('submit').textContent='保存并继续';}};
el('logout').onclick=async()=>{if(!uid)return;el('logout').disabled=true;try{const r=await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json','X-IELTS-User':uid},body:'{}'});if(!r.ok)throw Error('退出失败，请重试');location.replace('/login');}catch(e){el('error').textContent=e.message;el('logout').disabled=false;}};
</script></body></html>
