<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师授权</title><script src="/account-bootstrap.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f7;color:#19332c;font:16px/1.5 system-ui,sans-serif}
main{width:min(720px,100%);margin:auto;padding:36px 20px 80px}a{color:#326956;text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:28px;margin:20px 0 4px}header p{margin:0 0 22px;color:#51665e}
form{background:white;border:1px solid #d5dfda;border-radius:12px;overflow:hidden}.head,.confirm{padding:16px 20px}.head{display:flex;align-items:center;justify-content:space-between;background:#f9fbfa;border-bottom:1px solid #dde5e1}.head h2{font-size:17px;margin:0}
#people{max-height:46vh;overflow:auto;padding:4px 20px;min-height:48px}#people label,.head label{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;overflow-wrap:anywhere}#people label+label{border-top:1px solid #edf1ef}input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:#087961}
.confirm{border-top:1px solid #dde5e1;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:14px}.confirm label{display:grid;gap:6px;font-size:14px;font-weight:600}input[type=password],button{font:inherit;min-height:44px;border-radius:7px}input[type=password]{border:1px solid #97aaa1;width:100%;padding:8px 12px}button{padding:8px 18px;border:0;background:#08745f;color:white;cursor:pointer}button:disabled{opacity:.65}#msg{margin:12px 0}#people:empty:before{content:"正在加载教师名单…";color:#586b61;line-height:44px}
@media(max-width:540px){main{padding:20px 14px 84px}.confirm{grid-template-columns:1fr}.head,.confirm{padding:12px 14px}#people{padding-inline:14px}}
</style><main><a href="/admindata">← 教师工作台</a><header><h1>教师授权</h1><p>选择英语部教师，授予教师工作台权限。</p></header><form id="form"><div class="head"><h2>待授权教师</h2><label><input id="all" type="checkbox">全选</label></div><div id="people"></div><div class="confirm"><label>当前账号密码<input id="pw" type="password" autocomplete="current-password" required></label><button id="grant">授予所选教师权限</button></div></form><p id="msg" role="status"></p></main><script>
const el=id=>document.getElementById(id),headers={'X-IELTS-User':window.IELTS_ACCOUNT?.id||'','Content-Type':'application/json'};
async function load(){const r=await fetch('/api/admin/teacher-auth',{headers,cache:'no-store'}),data=await r.json();if(!r.ok)throw Error(data.error);el('people').replaceChildren();el('all').checked=false;for(const u of data.users){const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.value=u.id;label.append(box,u.name);el('people').append(label)}if(!data.users.length)el('people').textContent='暂无待授权教师'}
el('all').onchange=e=>el('people').querySelectorAll('input').forEach(b=>b.checked=e.target.checked);
el('form').onsubmit=async e=>{e.preventDefault();const ids=Array.from(el('people').querySelectorAll(':checked'),b=>b.value);if(!ids.length){el('msg').textContent='请先选择教师';return}el('grant').disabled=true;el('msg').textContent='正在授权…';try{const r=await fetch('/api/admin/teacher-auth',{method:'POST',headers,body:JSON.stringify({ids,password:el('pw').value})});const data=await r.json();if(!r.ok)throw Error(data.error);el('msg').textContent='已授权 '+ids.length+' 位教师';await load()}catch(err){el('msg').textContent=err.message}finally{el('pw').value='';el('grant').disabled=false}};
load().catch(err=>el('msg').textContent=err.message);
</script></html>
