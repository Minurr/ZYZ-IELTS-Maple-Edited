<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · IELTS Atlas</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f1;color:#19362c;font:16px system-ui,sans-serif;padding:24px}
main{width:100%;max-width:430px;background:white;padding:40px;border-radius:22px;box-shadow:0 16px 70px #19362c12}.brand{font-size:12px;letter-spacing:3px;color:#52836b}h1{font-size:30px;margin:18px 0 8px}p{color:#6a7770;line-height:1.7;font-size:14px}#username-hint{margin:8px 0 0;font-size:12px;line-height:1.5}label{display:block;margin:20px 0 7px;font-size:14px}input,select{width:100%;padding:13px;border:1px solid #d4ddd5;border-radius:9px;font:inherit}input:focus{outline:2px solid #65987c}button{cursor:pointer;width:100%;padding:14px;border:0;border-radius:9px;background:#245940;color:white;font:inherit;margin-top:24px}button:disabled{opacity:.6}.secondary{background:transparent;color:#245940;margin-top:8px;padding:10px}#error{color:#b33434;min-height:22px}footer{font-size:12px;color:#829087;margin-top:25px}[hidden]{display:none!important}
</style></head><body><main><h1 id="title">欢迎开始练习</h1><p id="intro">正在检查登录状态…</p>
<form id="form" hidden>
<div id="username-wrap" hidden><label for="username">账号名</label><input id="username" autocomplete="username" maxlength="80"><p id="username-hint" hidden>建议使用本人姓名或英文名，方便教师查阅。</p></div>
<label for="password" id="password-label">访问密码</label><input id="password" type="password" required maxlength="128" autocomplete="current-password">
<div id="confirm-wrap" hidden><label for="confirm">再次输入密码</label><input id="confirm" type="password" maxlength="128" autocomplete="new-password"></div>
<div id="school-wrap" hidden><label for="school">学校</label><select id="school"><option value="">请选择学校</option><option value="sample_school">示例学校</option></select><div id="custom-school" hidden><label for="schoolName">学校名称</label><input id="schoolName" maxlength="100" autocomplete="organization"></div><div id="school-class" hidden style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div><label for="grade">年级</label><select id="grade"><option value="">选择年级</option><option>Pre</option><option>G10</option><option>G11</option><option>G12</option><option>English Dept.</option></select></div><div><label for="className">班级</label><select id="className"><option value="">选择班级</option><option value="1">1 班</option><option value="2">2 班</option><option value="3">3 班</option><option value="4">4 班</option><option value="5">5 班</option><option value="6">6 班</option><option value="7">7 班</option><option value="8">8 班</option><option value="9">9 班</option></select></div></div></div>
<p id="error" role="alert"></p><button id="submit">进入网站</button><button class="secondary" id="switch" type="button" hidden>没有账号？立即注册</button>
</form></main>
<script>
let mode='access';const el=id=>document.getElementById(id);
function schoolFields(){const enabled=!el('school-wrap').hidden,sample_school=el('school').value==='sample_school',other=el('school').value==='other';el('school').required=enabled;el('custom-school').hidden=!enabled||!other;el('school-class').hidden=!enabled||!sample_school;el('schoolName').required=enabled&&other;el('grade').required=enabled&&sample_school;const needsClass=enabled&&sample_school&&el('grade').value!=='Pre'&&el('grade').value!=='English Dept.';el('className').required=needsClass;el('className').parentElement.hidden=!needsClass;if(!needsClass)el('className').value='';}
el('school').onchange=schoolFields;el('grade').onchange=schoolFields;
function profileBody(){return {school:el('school').value,schoolName:el('schoolName').value,grade:el('grade').value,className:el('className').value};}
function render(){let access=mode==='access',register=mode==='register';el('form').hidden=false;el('school-wrap').hidden=!register;schoolFields();el('title').textContent=access?'欢迎开始练习':register?'创建你的账号':'欢迎回来';el('intro').textContent=access?'首次访问请输入访问密码，此浏览器验证后将自动记住。':register?'填写账号、密码和学校资料，开始独立记录学习进度。':'登录后继续你的学习进度。';el('username-wrap').hidden=access;el('username').required=!access;el('username-hint').hidden=!register;el('username').labels[0].textContent=register?'用户名':'账号名';el('confirm-wrap').hidden=!register;el('confirm').required=register;el('password-label').textContent=access?'访问密码':'密码';el('password').autocomplete=register?'new-password':'current-password';el('password').minLength=register?6:1;el('submit').textContent=access?'进入网站':register?'注册并登录':'登录';el('switch').hidden=access;el('switch').textContent=register?'已有账号？返回登录':'没有账号？立即注册';el('error').textContent='';}
el('switch').onclick=()=>{mode=mode==='register'?'login':'register';render();};
el('form').onsubmit=async event=>{event.preventDefault();el('submit').disabled=true;el('submit').textContent='处理中，请稍等…';el('error').textContent='';try{const body={...profileBody(),username:el('username').value,password:el('password').value,confirmPassword:el('confirm').value};const response=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error);if(mode==='access'){mode='login';el('password').value='';render();}else location.replace('/');}catch(error){el('error').textContent=error.message;}finally{el('submit').disabled=false;el('submit').textContent=mode==='access'?'进入网站':mode==='register'?'注册并登录':'登录';}};
fetch('/api/status').then(r=>r.json()).then(s=>{if(s.access&&s.user){location.replace('/');return;}mode=s.access?'login':'access';render();}).catch(()=>{el('intro').textContent='连接失败，请刷新重试。';});
</script></body></html>
