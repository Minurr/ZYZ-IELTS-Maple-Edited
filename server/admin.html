function paintAccuracy(chart,sort){const root=$('chartBoard');root.replaceChildren();const selected=$('classFilter').value;const series=(chart?.series||[]).filter(item=>!selected||item.className===selected);if(!series.length){root.append(node('div','这个范围还没有可统计的正确率','empty'));return;}for(const item of series){const rows=[];(chart.axes||[]).forEach((axis,i)=>{if(item.values[i]!=null)rows.push({axis,value:item.values[i],count:(item.counts||[])[i]});});if(sort)rows.sort((a,b)=>a.value-b.value||String(a.axis).localeCompare(String(b.axis),'zh-CN'));root.append(accuracyCard(item.name,rows,!sort));}}
function paintPassageChoices(){const pick=$('passagePick');const passages=(classChartData?.passages||[]).filter(item=>item.kind==='reading');const previous=pick.value;pick.replaceChildren(...(passages.length?passages:[{examId:'',title:'暂无阅读篇目'}]).map(item=>{const option=node('option',item.title+(item.attempts?' · '+item.attempts+' 次':''));option.value=item.examId||item.title;return option;}));if(passages.some(item=>(item.examId||item.title)===previous))pick.value=previous;return passages.find(item=>(item.examId||item.title)===pick.value)||passages[0]||null;}
function paintCurrentChart(){if(chartMode==='reading')paintAccuracy(classChartData?.readingTypes,true);else if(chartMode==='listening')paintAccuracy(classChartData?.listeningTypes,true);else if(chartMode==='passage'){const current=paintPassageChoices();if(!current){$('chartBoard').replaceChildren(node('div','选择年级后显示各班各题正确率','empty'));return;}paintAccuracy(current,false);}}
async function loadClassCharts(){if(!chartMode)return;applyChartView();const grade=$('gradeFilter').value,school=$('schoolFilter').value;if(student||school!=='sample_school'||!grade){$('classChartNote').textContent='先把学校选成示例学校，再选择年级。Pre 和 English Dept. 按整个年级统计。';$('chartBoard').replaceChildren();return;}const seq=++classChartSeq;$('classChartNote').textContent='正在计算各班正确率…';try{const response=await fetch('/api/admin/class-charts?grade='+encodeURIComponent(grade)+'&days='+encodeURIComponent($('range').value||'0'),{headers:{'X-IELTS-User':IELTS_ACCOUNT.id},cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error||'加载失败');if(seq!==classChartSeq||!chartMode)return;classChartData=data;const selected=$('classFilter').value;$('classChartNote').textContent=(selected?selected+' 班':grade)+' · 整次正确题数为 0 的练习不计入。'+(chartMode==='passage'?'各题按题号排列。':'题型按正确率从低到高。');paintCurrentChart();}catch(error){if(seq===classChartSeq)$('classChartNote').textContent=error.message||'正确率加载失败';}}
function openChart(mode){chartMode=mode;if(student)return returnToList();render();}
$('navReadingTypes').onclick=()=>openChart('reading');$('navListeningTypes').onclick=()=>openChart('listening');$('navPassage').onclick=()=>openChart('passage');$('passagePick').onchange=()=>{if(chartMode==='passage'&&classChartData)paintCurrentChart();};
