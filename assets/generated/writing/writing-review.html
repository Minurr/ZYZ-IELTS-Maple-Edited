<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>写作反馈 · IELTS</title>
<link rel="stylesheet" href="/assets/generated/writing/writing-review.css?v=20261107-review5">
</head>
<body>
<header class="rv-top">
    <div class="rv-brand pixel-heading" aria-label="sample_school IELTS"><span class="px" data-font="0">S</span><span class="px" data-font="1">C</span><span class="px" data-font="2">C</span><span class="px" data-font="3">S</span><span class="px" data-font="4">C</span><span class="px-gap"></span><span class="px" data-font="0">I</span><span class="px" data-font="1">E</span><span class="px" data-font="2">L</span><span class="px" data-font="3">T</span><span class="px" data-font="4">S</span></div>
    <div class="rv-title">写作反馈</div>
    <div class="rv-top-right">
        <div class="rv-scores" id="rv-scores"></div>
        <button class="rv-back" id="rv-back" type="button">返回</button>
    </div>
</header>

<main class="rv-loading" id="rv-loading">正在打开作文…</main>

<main class="rv-main" id="rv-main" hidden>
    <section class="rv-prompt">
        <h1 class="rv-heading" id="rv-heading"></h1>
        <div class="rv-prompt-text" id="rv-prompt-text"></div>
        <figure class="rv-figure" id="rv-figure" hidden>
            <img id="rv-image" alt="题目配图">
        </figure>
        <p class="rv-meta-line" id="rv-meta-line"></p>
    </section>

    <section class="rv-paper" aria-label="作文">
        <div class="rv-paper-head">
            <strong>作文</strong>
            <span id="rv-paper-meta"></span>
        </div>
        <div class="rv-essay" id="rv-essay"></div>
    </section>

    <aside class="rv-side" aria-label="批注">
        <div class="rv-summary" id="rv-summary" hidden>
            <p class="rv-summary-text" id="rv-summary-text"></p>
        </div>
        <ol class="rv-list" id="rv-list"></ol>
        <p class="rv-empty" id="rv-empty" hidden></p>
    </aside>
</main>

<div class="rv-zoom" id="rv-zoom" hidden>
    <img id="rv-zoom-image" alt="题目配图放大">
</div>

<script src="/js/writingReview.js?v=20261107-review6"></script>
</body>
</html>
